notes: |
  Human-verified 2026-11-01: HTTP 200 (curl and headless Chromium). The page reads "OECD Data Explorer. Find, understand and use the data you need", and its Economy topic lists "Corporate sector", "External sector", "Leading indicators and tendency surveys", "Prices", "Productivity", "Economic outlook", "National accounts", "Short-term economic statistics" and "Subnational economy". The Data Explorer covers every OECD theme; this entry is scoped to its economic statistics. Other verticals catalog specific OECD datasets (housing: oecd-house-price-indices; labor: oecd-employment-labour-market; migration, tech). The SDMX endpoint https://sdmx.oecd.org/public/rest/dataflow/all?detail=allstubs returned HTTP 200 with 1552 dataflows, including DF_EO (Economic Outlook). The footer links "API documentation" to https://www.oecd.org/en/data/insights/data-explainers/2024/09/api.html, which I did not read. CSV is offered by the Download button; I did not test it.
  Licence checked 2026-11-01: not verified. The Data Explorer footer links "Terms & conditions" to https://www.oecd.org/en/about/terms-conditions.html, which returned a Cloudflare "Just a moment..." 403 to headless Chromium three times and a 403 to WebFetch. The labor-almanac oecd-employment-labour-market entry, checked on 2026-10-31, quotes that page's "3. Data" section as permitting reuse "for any purpose, even for commercial use" with credit to the OECD, and says it is not CC BY 4.0. I did not read it myself, so no licence is asserted.
  Licence re-checked 2026-11-01: OECD Terms & Conditions (https://www.oecd.org/en/about/terms-conditions.html, read in headless Chromium; earlier attempts met a Cloudflare check), section 3 "Data": "you can extract from, download, copy, adapt, print, distribute, share and embed Data for any purpose, even for commercial use", with credit to the OECD using the dataset's citation. The section also says Data "may be subject to restrictions beyond the scope of these Terms and Conditions" where third parties own them; per-indicator source notes were not checked. These are OECD's own terms, not a named open licence.
