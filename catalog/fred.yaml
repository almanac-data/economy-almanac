id: fred
type: dataset
title: FRED (Federal Reserve Economic Data)
description: |
  The Federal Reserve Bank of St. Louis's database of US and international economic time series from many sources (BLS, BEA, the Federal Reserve Board, Census and others), with graphs, a release calendar, and a free-key API. It is now the main route to many Federal Reserve Board series as the Board's Data Download Program is retired.
