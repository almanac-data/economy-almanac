notes: |
  Human-verified 2026-11-01: HTTP 200 in headless Chromium. curl failed this session with "HTTP/2 stream 1 was not closed cleanly: INTERNAL_ERROR"; the issue reported no response on 2026-10-31. The page reads "FRED Economic Data. Your trusted source for economic data since 1991", with a banner: "FRED will undergo scheduled maintenance on November 3, 2026, from 5 to 6 PM Central Time." News items include "FRED Adds Median Inflation Data from the Cleveland Fed". The API documentation (https://fred.stlouisfed.org/docs/api/fred) links to "API Keys"; a keyless call to https://api.stlouisfed.org/fred/series?series_id=GDP&file_type=json returned HTTP 400, consistent with a required key. The Federal Reserve Bank of St. Louis is a regional Reserve Bank, not a federal agency, so FRED as a whole is not treated as public domain. Not checked: download formats, rate limits.
  Licence checked 2026-11-01: FRED's Legal Notices (https://fred.stlouisfed.org/legal/) say "FRED provides data and data services to the public for non-commercial, educational, and personal uses subject to a few prohibitions. Furthermore, other uses (e.g., commercial) are subject to additional restrictions." There are "three (3) types of data series copyright status": "Copyrighted: Pre-approval required" (third-party series "may only be used for non-commercial educational or personal use" without the holder's permission), "Copyrighted: Citation required", and "Public Domain: Citation requested". Under "IV. Commercial Use", the latter two "may be used for internal commercial uses and may be displayed in textbooks, newsletters, or reports to clients provided that appropriate attribution is given to FRED as well as the original source". Check each series' status before reuse.
