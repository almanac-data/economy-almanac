notes: |
  Human-verified 2026-10-31: HTTP 200. The page shows the release calendar (releases dated 29 Oct 2026), a statistics catalogue, and "The BIS SDMX API web service offers programmatic access to data and metadata". BIS terms (https://www.bis.org/about/terms-conditions) say all rights in "publications and statistical data" are owned by the BIS. Users may download, display, and reproduce BIS Material "for non-commercial purposes", and the separate limited-extract permission explicitly excludes statistics from the BIS Data Portal. It is cataloged because it is authoritative; reusers should read the terms. A steward may want to confirm whether a more permissive statistics licence exists.
