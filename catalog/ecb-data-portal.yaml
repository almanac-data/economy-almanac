notes: |
  Human-verified 2026-11-01: HTTP 200 (curl and headless Chromium). The home page shows key figures, "Inflation rate September 2026 3.8 %", "Monetary aggregate M3 September 2026 3.5 %" and "US dollar 30 October 2026 1.1172", and links to API help (https://data.ecb.europa.eu/help/api/overview) and refreshable Excel downloads. A test call to https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?lastNObservations=1&format=csvdata returned HTTP 200 CSV with the 2026-10-30 reference rate 1.1172, without a key. xlsx stands for the refreshable Excel download, which I did not test. The data cart and login are optional.
  Licence checked 2026-11-01: the portal footer links "Disclaimer & Copyright" to https://www.ecb.europa.eu/services/disclaimer/html/index.en.html, which redirects to /services/using-our-site/disclaimer/html/index.en.html. It says "Copyright © for the entire content of this website: European Central Bank", and "users of this website may make free use of the information obtained directly from it subject to the following conditions: When such information is distributed or reproduced, it must appear accurately and the ECB must be cited as the source. If the information is modified by the user (e.g. by seasonal adjustment of statistical data or calculation of growth rates) this must be stated explicitly." The exception for named-author documents (working papers) does not concern the data. This is the ECB website's general notice; no portal-specific data licence was found.
