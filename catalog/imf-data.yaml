notes: |
  Human-verified 2026-11-01 in headless Chromium: HTTP 200. curl got 403, as the issue reported on 2026-10-31. https://data.imf.org/ redirects to https://data.imf.org/en, which is cataloged. The page reads "ACCESS TO ECONOMIC AND FINANCIAL DATA", with Data Explorer, Datasets and Release Calendar sections. It lists "World Economic Outlook October 2026" (WEO "Date last updated: Oct 12, 2026", "published twice a year in April and October", "Data are available from 1980 to the present, and projections for most data series are provided for the next five years"), the Fiscal Monitor (updated Oct 13, 2026) and COFER. It links an API page (https://data.imf.org/en/Resource-Pages/IMF-API) and an Excel add-in; I read neither, so whether the API needs a key, and its formats, are unchecked. A "SIGN IN" link exists; viewing the data needed no sign-in.
  Licence checked 2026-11-01: the portal's "COPYRIGHT AND USAGE" link (https://www.imf.org/external/terms.htm) redirects to https://www.imf.org/en/About/copyright-and-terms, which returned an Akamai 403 to curl and headless Chromium, so I read it through WebFetch only. Under "Special Terms for Statistical Data" (covering IFS, BOP, DOTS, GFS, the WEO database and other IMF statistics) it says "Users may download, extract, copy, create derivative works, publish, distribute, and use Data", "Distributed or reproduced Data must appear accurately with attribution to the IMF as the source", "If IMF Data is sold by Users as a standalone product, sellers must inform purchasers" that it is free from the IMF, and "For any potential commercial reuse of IMF Data, email copyright@imf.org to request permission". The general terms add "The IMF prohibits bulk download of information by automated technology without explicit permission". The WebFetch tool summarised parts of the page, so a steward should confirm the exact wording in a browser.
