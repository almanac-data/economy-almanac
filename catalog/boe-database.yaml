notes: |
  Human-verified 2026-11-01: HTTP 200 (curl and headless Chromium). The page reads "Browse, visualise and export the data series published by the Bank of England" and "Database last updated on 30 October 2026 at 10:00", with quick links to "GBP daily spot rates", "Official Bank Rate history", "Yield curves" and visual summaries of money and credit statistics. Export is offered, but I did not test the export formats, so none are listed; no API was checked. Daily cadence reflects the daily exchange and interest rate series; money and credit statistics are monthly.
  Licence checked 2026-11-01: the Bank's legal page (https://www.bankofengland.co.uk/legal), "Bank of England Database" section, says "The information made available via the Database is the copyright of the Governor and Company of the Bank, unless otherwise stated. Reproduction of data in the Database is subject to the terms of the UK Open Government Licence, allowing and encouraging free and flexible data reuse." It adds that "selected exchange rate data and series are excluded from this licence as they are reproduced by the Bank under licence from third parties", that Isle of Man, Guernsey and Jersey MFI data belong to those authorities, and it gives a specific attribution statement for SONIA data. The site's general terms (non-commercial personal use) do not apply to the Database, which has its own terms.
