notes: |
  Human-verified 2026-10-31 in headless Chromium: HTTP 200, page "NATIONAL ACCOUNTS Database" with selected and detailed datasets and a data revisions section. Eurostat's copyright notice (https://ec.europa.eu/eurostat/help/copyright-notice) licenses its content under CC BY 4.0. The ESA 2010 framing and the quarterly cadence for main aggregates come from Eurostat's usual metadata and weren't checked here. The generic /web/economy/database URL returned 404, so this entry uses the national accounts theme.
